{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    Upload de Dados Diários
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100">Processar Planilha</button>
                    </form>
                </div>
            </div>
            <a href="{% url 'dashboard' %}" class="btn btn-link mt-3">Voltar para Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
